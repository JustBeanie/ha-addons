name: "Hyperion.NG"
slug: "hyperion_ng"
description: "Runs Hyperion.NG with Home Assistant ingress support."
version: "3.0.6"
url: "https://github.com/JustBeanie/ha-addons/tree/main/hyperion_ng"
image: "ghcr.io/justbeanie/hyperion-ng"

arch:
  - amd64
  - aarch64

# The app uses a signed, published multi-architecture image. Home Assistant
# downloads updates instead of compiling Hyperion on the host.
init: false
backup: cold

# Hyperion's web UI listens on 8090. Home Assistant's ingress proxy connects
# to this port; explicit port mappings keep native protocols available without
# granting the container the host network namespace.
ingress: true
ingress_port: 8090
ingress_entry: ""
panel_icon: "mdi:television-ambient-light"
panel_title: "Hyperion.NG"

# 3.0.0 changes networking from host mode to explicit mappings. Existing
# installations should review any custom Hyperion protocol/discovery ports.
breaking_versions:
  - "3.0.0"

environment:
  QT_QPA_PLATFORM: offscreen
  XDG_RUNTIME_DIR: /run

devices:
  - /dev/ttyUSB0
  - /dev/ttyACM0
  - /dev/spidev0.0
  - /dev/mem
  - /dev/vcio

# Expose the UI and native Hyperion services through explicit mappings.
ports:
  8090/tcp: 8090
  8092/tcp: 8092
  19444/tcp: 19444
  19445/tcp: 19445
  19400/tcp: 19400

ports_description:
  8090/tcp: "Hyperion Web UI"
  8092/tcp: "Hyperion Web UI (HTTPS)"
  19444/tcp: "Hyperion JSON Server"
  19445/tcp: "Hyperion Proto Server"
  19400/tcp: "Hyperion FlatBuffers Server"

map:
  # Keep Hyperion's database in the app's persistent, backed-up config
  # directory. The image starts Hyperion with --userdata /config.
  - type: app_config
    read_only: false
    path: /config
  - type: ssl
    read_only: true
    path: /ssl
