name: "Hyperion.NG"
slug: "hyperion_ng"
description: "Runs Hyperion.NG using sirfragalot/hyperion.ng (host network, no ingress)."
version: "2.2.0"
url: "https://hub.docker.com/r/sirfragalot/hyperion.ng"

arch:
  - amd64
  - aarch64
  - armv7

image: "sirfragalot/hyperion.ng"
host_network: true

environment:
  QT_QPA_PLATFORM: offscreen
  XDG_RUNTIME_DIR: /run

devices:
  - /dev/ttyUSB0:/dev/ttyUSB0
  - /dev/ttyACM0:/dev/ttyACM0
  - /dev/spidev0.0:/dev/spidev0.0
  - /dev/mem:/dev/mem
  - /dev/vcio:/dev/vcio

# Expose UI + services (even with host networking, this documents the ports in HA)
ports:
  8090/tcp: 8090
  19444/tcp: 19444
  19445/tcp: 19445

ports_description:
  8090/tcp: "Hyperion Web UI"
  19444/tcp: "Hyperion JSON Server"
  19445/tcp: "Hyperion Proto Server"

map:
  - type: addon_config
    read_only: false
    path: /root/.hyperion
  - type: ssl
    read_only: true
    path: /ssl

startup: application
boot: auto
