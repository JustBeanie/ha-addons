name: "Hyperion.NG"
slug: "hyperion_ng"
description: "Runs Hyperion.NG from the official release package with Home Assistant ingress support."
version: "2.2.8"
url: "https://github.com/JustBeanie/ha-addons/tree/main/hyperion_ng"

arch:
  - amd64
  - aarch64

# The app owns its image build and installs the official Hyperion release. This
# keeps Hyperion updates independent of third-party container image rebuilds.
init: false
backup: cold
host_network: true

# Hyperion's web UI listens on 8090. Home Assistant's ingress proxy connects
# to this port while host networking keeps the LED/network protocols available
# on the host for clients and hardware.
ingress: true
ingress_port: 8090
ingress_entry: /
panel_icon: "mdi:television-ambient-light"
panel_title: "Hyperion.NG"

environment:
  QT_QPA_PLATFORM: offscreen
  XDG_RUNTIME_DIR: /run

devices:
  - /dev/ttyUSB0
  - /dev/ttyACM0
  - /dev/spidev0.0
  - /dev/mem
  - /dev/vcio

# Expose UI + services (even with host networking, this documents the ports in HA)
ports:
  8090/tcp: 8090
  8092/tcp: 8092
  19444/tcp: 19444
  19445/tcp: 19445

ports_description:
  8090/tcp: "Hyperion Web UI"
  8092/tcp: "Hyperion Web UI (HTTPS)"
  19444/tcp: "Hyperion JSON Server"
  19445/tcp: "Hyperion Proto Server"

map:
  # Keep the existing Hyperion database in the app's public, backed-up config
  # directory. This preserves configurations created by the previous image,
  # which also used addon_config.
  - type: addon_config
    read_only: false
    path: /root/.hyperion
  - type: ssl
    read_only: true
    path: /ssl
