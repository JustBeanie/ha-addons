name: "ToneWatch"
version: "0.3.0"
slug: "tonewatch"
description: >-
  Detect two-tone pages, record calls, and publish supplemental notifications
  from a Home Assistant app.
url: "https://github.com/JustBeanie/ha-addons/tree/main/tonewatch"
stage: experimental
arch:
  - aarch64
  - amd64

# One multi-architecture image index serves both supported architectures; do not
# add Supervisor's {arch} substitution to this image name.
image: "ghcr.io/justbeanie/tonewatch"

# The image starts tini as its init process.
init: false
ingress: true
panel_icon: mdi:fire-truck
panel_title: ToneWatch
audio: true
usb: true
map:
  - type: media
    read_only: false
    path: /media
services:
  - "mqtt:want"
discovery:
  - tonewatch
backup_pre: tonewatch db checkpoint
options:
  log_level: info
  public_base_url: ""
  mqtt_mode: supervisor
  ui_password: ""
schema:
  log_level: "list(debug|info|warning|error)"
  public_base_url: "str?"
  mqtt_mode: "list(supervisor|manual|off)"
  ui_password: "password?"
