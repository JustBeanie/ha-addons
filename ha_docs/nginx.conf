worker_processes 1;
daemon off;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Freshness for the built site. Pages stay no-cache so a rebuild is seen on
    # the next navigation. Assets whose URL changes with their content are
    # immutable: Material's are hashed in the filename, and asset_version.py
    # appends ?v=<digest> to the add-on's own. 1.17.0 sent no-cache on those
    # too, and every page change then revalidated every stylesheet through
    # ingress before it could paint - a blank frame between pages.
    map $request_uri $site_cache_control {
        default "no-cache";
        "~^[^?]*/assets/(stylesheets|javascripts)/[^?]*\.[0-9a-f]{8}\.min\.(css|js)$" "public, max-age=31536000, immutable";
        "~^[^?]*/assets/[^?]+\?v=[0-9a-f]+$" "public, max-age=31536000, immutable";
    }

    # Writable scratch paths (the base image has no /var/lib/nginx defaults set).
    client_body_temp_path /tmp/nginx_client;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    server {
        listen 8099 default_server;
        # Supervisor's ingress proxy is the only intended network client.
        # Keep loopback available for the local healthcheck and internal proxy.
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;
        root /data/site;
        index index.html;

        # Ingress mounts this add-on under /api/hassio_ingress/<token>/.
        # An absolute redirect would drop that prefix and 404, so keep every
        # redirect relative.
        absolute_redirect off;

        # Highlights and notes. annotations.py listens on loopback only, so
        # this proxy is the sole way in and ingress is the sole way to it -
        # which is why that service needs no auth of its own.
        location /anno/ {
            proxy_pass http://127.0.0.1:8100;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # The built site, with Cache-Control from the map above. Without an
        # explicit rule a browser guesses freshness from Last-Modified and can
        # keep showing the previous build for a while. /anno/ needs no header
        # here: annotations.py already sends no-store.
        #
        # An add_header in a location REPLACES every add_header inherited from
        # http{}, so the security headers above must be repeated here or they
        # silently vanish from every page. test_security.py pins this.
        location / {
            add_header Cache-Control $site_cache_control always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
            try_files $uri $uri/ =404;
        }
    }
}
