worker_processes 1;
daemon off;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # All interactive traffic comes from Supervisor ingress.  Keep this IP
    # allowlist even though the user-id check below is the authentication gate.
    # A compromised sibling add-on must not be able to call the annotation API.
    allow 172.30.32.2;
    deny all;

    limit_req_zone $http_x_remote_user_id zone=anno_per_user:1m rate=5r/s;

    # Writable scratch paths (the base image has no /var/lib/nginx defaults set).
    client_body_temp_path /tmp/nginx_client;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    server {
        listen 8099 default_server;
        root /data/site;
        index index.html;

        # Ingress mounts this add-on under /api/hassio_ingress/<token>/.
        # An absolute redirect would drop that prefix and 404, so keep every
        # redirect relative.
        absolute_redirect off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Material emits a small number of trusted inline bootstrap scripts and
        # Mermaid emits inline SVG styles.  The page hook supplies the stricter,
        # exact script hashes in a meta policy; policies intersect in browsers.
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'self'; form-action 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'" always;

        # Supervisor's watchdog does not carry an ingress user header.  It is
        # still protected by the source allowlist above and is read-only.
        location = /health {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8100/anno/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Remote-User-Id "";
        }

        # Highlights and notes. annotations.py listens on loopback only, so
        # this proxy is the sole way in and ingress is the sole way to it -
        # which is why that service needs no auth of its own.
        location /anno/ {
            if ($http_x_remote_user_id = "") { return 403; }
            limit_req zone=anno_per_user burst=10 nodelay;
            limit_except GET POST { deny all; }
            client_max_body_size 64k;
            proxy_pass http://127.0.0.1:8100;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            if ($http_x_remote_user_id = "") { return 403; }
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ =404;
        }
    }
}
