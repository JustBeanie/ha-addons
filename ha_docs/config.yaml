name: "HA Docs"
slug: "ha_docs"
description: "Serves a git repo of Markdown as a searchable MkDocs site behind HA ingress."
version: "1.5.0"
url: "https://github.com/JustBeanie/ha-addons"
breaking_versions:
  - "1.4.0"

arch:
  - amd64
  - aarch64

# No `image:` key on purpose - the Supervisor builds this locally on install,
# so there is no ghcr publishing or CI to keep alive.

init: false
startup: application
boot: auto

ingress: true
ingress_port: 8099
watchdog: "http://[HOST]:8099/health"
panel_icon: "mdi:book-open-variant-outline"
panel_title: "HA Docs"

# Only used to mirror notes onto a to-do list. Nothing else calls the core API,
# and no state is ever read.
homeassistant_api: true

options:
  # Placeholder - set this to your own docs repo in the add-on configuration.
  repository: "https://github.com/example/my-docs.git"
  branch: "main"
  git_username: "x-access-token"
  poll_interval: 900
  site_name: "Docs"
  todo_entity: ""
  repair_doc_links: true

schema:
  repository: "url"
  branch: "str(1,255)"
  # Git's non-secret username for HTTPS token authentication. GitHub accepts
  # x-access-token; other providers may require a different account name.
  git_username: "str(1,128)"
  poll_interval: "int(60,86400)"
  site_name: "str(1,100)"
  # Only needed if the docs repo is ever made private.
  git_token: "password?"
  # Where notes are mirrored, e.g. todo.docs_review. Unset = highlights and
  # notes still work, they just stay inside the docs site.
  todo_entity: "str?"
  # When true, normalize only unambiguous automation/script 📖 Docs: links
  # after each successful repository sync. Ambiguous links fail visibly.
  repair_doc_links: "bool"
