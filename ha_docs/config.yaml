name: "HA Docs"
slug: "ha_docs"
description: "Serves a git repo of Markdown as a searchable MkDocs site behind HA ingress."
version: "1.8.1"
url: "https://github.com/JustBeanie/ha-addons"

arch:
  - amd64
  - aarch64

# No `image:` key on purpose - the Supervisor builds this locally on install,
# so there is no ghcr publishing or CI to keep alive.

init: false
startup: application
boot: auto

ingress: true
ingress_port: 8099
panel_icon: "mdi:book-open-variant-outline"
panel_title: "HA Docs"

# Only used to mirror notes onto a to-do list. Nothing else calls the core API,
# and no state is ever read.
homeassistant_api: true

options:
  # Placeholder - set this to your own docs repo in the add-on configuration.
  repository: "https://github.com/example/my-docs.git"
  branch: "main"
  poll_interval: 900
  site_name: "Docs"
  todo_entity: ""
  report_doc_link_repairs: true
  repair_scan_on_start: true
  repair_scan_concurrency: 4
  repair_progress_interval: 25
  repair_scan_heartbeat_interval: 10
  watch_entity_updates: true
  entity_update_debounce: 3
  log_level: "info"

schema:
  repository: "url"
  branch: "str"
  poll_interval: "int(60,86400)"
  site_name: "str"
  # Only needed if the docs repo is ever made private.
  git_token: "password?"
  # Where notes are mirrored, e.g. todo.docs_review. Unset = highlights and
  # notes still work, they just stay inside the docs site.
  todo_entity: "str?"
  # Requires the Spook integration. Raise a Repairs issue for every docs-link
  # candidate; descriptions are never changed automatically.
  report_doc_link_repairs: "bool"
  # Run the report-only Docs-link Repair scan in the background at app start.
  repair_scan_on_start: "bool"
  # Bounded parallel reads from the HA config API. Repair actions remain serial.
  repair_scan_concurrency: "int(1,8)"
  # Emit a visible scan progress line after this many entities are read.
  repair_progress_interval: "int(1,100)"
  # Report that HA's config API is still being awaited between completed reads.
  repair_scan_heartbeat_interval: "int(1,300)"
  # Subscribe to HA entity changes and validate only the affected entity.
  watch_entity_updates: "bool"
  # Coalesce quick reload/state changes for the same entity into one check.
  entity_update_debounce: "int(1,30)"
  # Applies to every HA Docs component, including the Python link scanner.
  log_level: "list(trace|debug|info|warning|error)"
