site_name: !ENV [SITE_NAME, "HA Automation Docs"]

# The docs repo is cloned here by run.sh. Keeping this config inside the add-on
# rather than in the docs repo means the source repo needs no site scaffolding
# at all - it stays exactly as GitHub renders it.
docs_dir: /data/repo
site_dir: /data/site

# Exported by run.sh from the `repository` option - never from the tokenised
# clone URL, so a configured git_token cannot be rendered into a page. Empty
# when the docs repo is not on GitHub, which leaves the edit and view actions
# switched off rather than pointing somewhere wrong.
repo_url: !ENV [REPO_URL, ""]
edit_uri: !ENV [EDIT_URI, ""]

# Shown in the site footer. run.sh fills this in with the commit the site was
# built from, which is the only way to tell a stale site from a current one
# without opening the add-on log.
copyright: !ENV [DOCS_BUILD_STAMP, ""]

# Flat .html files rather than directory URLs. Under ingress the add-on is
# mounted at a random /api/hassio_ingress/<token>/ prefix, and directory URLs
# make nginx issue trailing-slash redirects that drop that prefix.
use_directory_urls: false

theme:
  name: material
  # Holds the vendored Mermaid runtime and its init script. MkDocs copies
  # non-template files out of every theme directory into the built site, so
  # anything under overrides/assets/ lands at /assets/ alongside Material's own.
  custom_dir: /opt/ha_docs/overrides
  # Material otherwise fetches Roboto from fonts.googleapis.com on every page
  # load. This serves a LAN-only box, so use system fonts and stay offline.
  font: false
  features:
    - navigation.sections
    - navigation.top
    # README.md in a folder becomes that section's own page rather than sitting
    # inside it as a separate child.
    - navigation.indexes
    # Keeps the address bar on the section being read, so a URL copied out of
    # the bar lands where the reader actually was.
    - navigation.tracking
    # Previous/next links at the foot of every page. With no `nav:` and 40-odd
    # documents, the sidebar was the only way to move between them.
    - navigation.footer
    # NOTE: navigation.instant is deliberately absent. Both mermaid-init.js and
    # annotate.js bind to DOMContentLoaded and rely on full page loads; turning
    # it on silently kills every diagram and every highlight until they are
    # rewritten onto Material's document$ observable.
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
    # Per-page "edit this page" / "view source" links back to GitHub. Both are
    # inert unless run.sh found a GitHub repository URL to export.
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 4
      # GitHub-identical heading slugs. Without this the anchor links that
      # target emoji headings (#-nightlight-script-id-desync) and em-dash
      # headings (#dusk-and-away-rules--per-window) all break silently.
      # See ghslug.py.
      slugify: !!python/name:ghslug.slugify
  - pymdownx.superfences:
      custom_fences:
        # ```mermaid fences become <div class="diagram">, NOT the conventional
        # <div class="mermaid">. Material's built-in diagram support keys off
        # the "mermaid" class and, when it matches, fetches the runtime from
        # cdn.jsdelivr.net - which this box cannot reach and should not try.
        # Using a different class keeps that code path dormant and leaves
        # rendering entirely to mermaid-init.js.
        #
        # fence_div_format (not fence_code_format) because Mermaid parses the
        # element's own markup; an inner <code> wrapper ends up in the diagram
        # source and breaks the parse.
        - name: mermaid
          class: diagram
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.details
  # superfences was already here; this is the other half of the pair. Blocks opt
  # in per fence with `linenums="1"`, which then get anchor links per line - the
  # useful part when a doc is walking through a long automation.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite

# Load order matters: the UMD bundle assigns globalThis.mermaid synchronously,
# and the init script expects it to already exist.
extra_javascript:
  - assets/mermaid.min.js
  - assets/mermaid-init.js
  # Highlights and notes. Independent of the two above - it only needs the DOM
  # and the annotation service nginx proxies at /anno/.
  - assets/annotate.js
  # Live status for both link checkers. Reads /anno/scan; mounts into
  # annotate.js's drawer on a narrow screen, so it must load after it.
  - assets/checker.js
  # Independent controls for the navigation and table-of-contents sidebars on
  # wide screens. Material's normal drawer controls remain in charge on mobile.
  - assets/panels.js
  # Click-to-sort table headers. No load-order dependency of its own - it
  # touches nothing the others own, and reads no global.
  - assets/tables.js

extra_css:
  - assets/diagrams.css
  - assets/annotate.css
  - assets/checker.css
  - assets/panels.css
  - assets/tables.css

plugins:
  - search:
      # The default separator is whitespace and hyphens, which makes
      # `sensor.nw_sun_penetration` a single indivisible token - so searching
      # for `penetration` found nothing at all. Splitting on dots and
      # underscores as well is what makes an entity-ID-heavy docs set
      # searchable by any part of an ID. The `(?!\d)` guard keeps decimals
      # like `1.5` intact.
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|_+'

# No `nav:` - MkDocs builds it from the file tree and uses README.md as the
# index, so adding a doc to the source repo needs no change here.

exclude_docs: |
  .gitignore
  .claude/

# Retired documents stay built, linkable and searchable - they are still the
# record of why something was removed - but they do not sit in the sidebar
# looking like current design. Verified: the page is still emitted and still in
# the search index, it just leaves the nav.
not_in_nav: |
  docs/retired/
