name: HA Docs security

on:
  pull_request:
    paths:
      - "ha_docs/**"
      - ".github/workflows/ha-docs.yml"
  push:
    branches:
      - main
    paths:
      - "ha_docs/**"
      - ".github/workflows/ha-docs.yml"

permissions:
  contents: read

jobs:
  test:
    name: Unit and policy tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r ha_docs/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q ha_docs
      - name: Run HA Docs tests
        run: python -m unittest discover -s ha_docs/tests -v

  addon-lint:
    name: Add-on configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb # v2.21.0
        with:
          path: "./ha_docs"

  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Build add-on image
        uses: home-assistant/builder@6cb4fd3d1338b6e22d0958a4bcb53e0965ea63b4 # 2026.02.1
        with:
          image: ${{ matrix.arch }}
          args: |
            --test \
            --${{ matrix.arch }} \
            --target /data/ha_docs \
            --addon
