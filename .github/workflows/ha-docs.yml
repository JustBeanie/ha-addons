---
name: HA Docs

on:
  pull_request:
    paths:
      - "ha_docs/**"
      - ".hadolint.yaml"
      - ".github/workflows/ha-docs.yml"
  push:
    branches:
      - main
    paths:
      - "ha_docs/**"
      - ".hadolint.yaml"
      - ".github/workflows/ha-docs.yml"
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q ha_docs
      - name: Run unit tests
        working-directory: ha_docs
        run: python -m unittest discover -s tests -v

  lint:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Home Assistant app manifest
        uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb # v2.21.0
        with:
          path: "./ha_docs"
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ha_docs/Dockerfile
          config: .hadolint.yaml
      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1008 -s bash -x
        with:
          scandir: ./ha_docs

  build:
    name: Build ${{ matrix.arch }} app image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Read app build metadata
        id: metadata
        shell: bash
        env:
          APP_ARCH: ${{ matrix.arch }}
        run: |
          version="$(sed -n 's/^version: "\(.*\)"/\1/p' ha_docs/config.yaml)"
          base="$(awk -v arch="${APP_ARCH}:" '$1 == arch { gsub(/"/, "", $2); print $2 }' ha_docs/build.yaml)"
          test -n "${version}"
          test -n "${base}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
      - name: Build app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./ha_docs
          platforms: linux/${{ matrix.platform }}
          push: false
          tags: local/ha-docs:${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ steps.metadata.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
