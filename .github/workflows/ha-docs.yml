---
name: HA Docs

on:
  pull_request:
    paths:
      - "ha_docs/**"
      - ".hadolint.yaml"
      - ".github/workflows/ha-docs.yml"
  push:
    branches:
      - main
    paths:
      - "ha_docs/**"
      - ".hadolint.yaml"
      - ".github/workflows/ha-docs.yml"
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q ha_docs
      - name: Run unit tests
        working-directory: ha_docs
        run: python -m unittest discover -s tests -v

  lint:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Home Assistant app manifest
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./ha_docs"
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ha_docs/Dockerfile
          config: .hadolint.yaml
      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1008 -s bash -x
        with:
          scandir: ./ha_docs

  build:
    name: Build ${{ matrix.arch }} app image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Read app build metadata
        id: metadata
        shell: bash
        env:
          APP_ARCH: ${{ matrix.arch }}
        run: |
          version="$(sed -n 's/^version: "\(.*\)"/\1/p' ha_docs/config.yaml)"
          base="$(awk -v arch="${APP_ARCH}:" '$1 == arch { gsub(/"/, "", $2); print $2 }' ha_docs/build.yaml)"
          test -n "${version}"
          test -n "${base}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
      - name: Build app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./ha_docs
          platforms: linux/${{ matrix.platform }}
          push: false
          tags: local/ha-docs:${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ steps.metadata.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}

  prepare-publish:
    name: Prepare published image
    needs: [lint, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ fromJSON(steps.info.outputs.version) }}
      app_name: ${{ fromJSON(steps.info.outputs.name) }}
      description: ${{ fromJSON(steps.info.outputs.description) }}
      url: ${{ fromJSON(steps.info.outputs.url) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./ha_docs
      - name: Normalize image name
        id: normalize
        shell: bash
        env:
          IMAGE: ${{ fromJSON(steps.info.outputs.image) }}
        run: |
          set -euo pipefail
          echo "image_name=${IMAGE##*/}" >> "${GITHUB_OUTPUT}"
          echo "registry_prefix=${IMAGE%/*}" >> "${GITHUB_OUTPUT}"
      - name: Prepare architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  publish:
    name: Publish ${{ matrix.arch }} image
    needs: prepare-publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-publish.outputs.build_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./ha_docs
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.24-2026.08.0
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare-publish.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare-publish.outputs.app_name }}
            io.hass.description=${{ needs.prepare-publish.outputs.description }}
            io.hass.url=${{ needs.prepare-publish.outputs.url }}
          push: true
          version: ${{ needs.prepare-publish.outputs.version }}

  publish-manifest:
    name: Publish multi-architecture manifest
    needs: [prepare-publish, publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare-publish.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare-publish.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare-publish.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare-publish.outputs.registry_prefix }}
