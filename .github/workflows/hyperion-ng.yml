name: Hyperion.NG

on:
  pull_request:
    branches:
      - main
    paths:
      - "hyperion_ng/**"
      - ".github/workflows/hyperion-ng.yml"
  push:
    branches:
      - main
    paths:
      - "hyperion_ng/**"
      - ".github/workflows/hyperion-ng.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare linter compatibility copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lint
          cp -a hyperion_ng .lint/hyperion_ng
          # The pinned linter predates the current Supervisor schema's
          # breaking_versions key; keep the production manifest unchanged.
          sed -i '/^breaking_versions:/,/^environment:/ { /^environment:/!d; }' \
            .lint/hyperion_ng/config.yaml
          # The same pinned linter also predates the webui metadata key.
          sed -i '/^webui:/d' .lint/hyperion_ng/config.yaml
      - name: Lint Home Assistant app manifest
        uses: frenck/action-addon-linter@v2.21.1
        with:
          path: ./.lint/hyperion_ng
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: hyperion_ng/Dockerfile
          config: .hadolint.yaml

  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ fromJSON(steps.info.outputs.version) }}
      app_name: ${{ fromJSON(steps.info.outputs.name) }}
      description: ${{ fromJSON(steps.info.outputs.description) }}
      url: ${{ fromJSON(steps.info.outputs.url) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./hyperion_ng
      - name: Normalize image name
        id: normalize
        shell: bash
        env:
          IMAGE: ${{ fromJSON(steps.info.outputs.image) }}
        run: |
          set -euo pipefail
          echo "image_name=${IMAGE##*/}" >> "${GITHUB_OUTPUT}"
          echo "registry_prefix=${IMAGE%/*}" >> "${GITHUB_OUTPUT}"
      - name: Prepare architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: [lint, prepare]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./hyperion_ng
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.app_name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          version: ${{ needs.prepare.outputs.version }}
      - name: Smoke-test Hyperion startup
        if: github.event_name == 'pull_request'
        timeout-minutes: 3
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}:${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          name="hyperion-smoke-${{ matrix.arch }}"

          cleanup() {
            docker logs "${name}" || true
            docker rm -f "${name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "${name}" \
            --entrypoint hyperiond \
            --env QT_QPA_PLATFORM=offscreen \
            --env XDG_RUNTIME_DIR=/run \
            --mount type=tmpfs,destination=/data \
            --mount type=tmpfs,destination=/root/.hyperion \
            --health-interval=2s \
            --health-timeout=3s \
            --health-start-period=10s \
            --health-retries=5 \
            "${IMAGE}"

          consecutive=0
          for attempt in $(seq 1 45); do
            running="$(docker inspect -f '{{.State.Running}}' "${name}")"
            health="$(docker inspect -f '{{.State.Health.Status}}' "${name}")"
            test "${running}" = true
            test "${health}" != unhealthy

            if [ "${health}" = healthy ]; then
              consecutive=$((consecutive + 1))
              if [ "${consecutive}" -ge 3 ]; then
                docker exec "${name}" curl --max-time 5 -fsS \
                  http://127.0.0.1:8090/
                exit 0
              fi
            else
              consecutive=0
            fi
            sleep 2
          done

          echo "Hyperion did not become healthy" >&2
          exit 1

  manifest:
    name: Publish multi-architecture manifest
    needs: [lint, prepare, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
